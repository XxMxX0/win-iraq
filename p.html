<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d0d0d">
<title>وين بالعراق — موقع مشارك</title>
<style>
  :root {
    --primary: #ff7a00;
    --gold: #ff9d3d;
    --bg: #0d0d0d;
    --surface: #1a1a1a;
    --text: #f0ece4;
    --muted: #9a938a;
    --border: #2d2d2d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background:
      radial-gradient(ellipse 120% 60% at 50% 0%, rgba(255,122,0,.14), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: "Segoe UI", Tahoma, "Noto Kufi Arabic", Arial, sans-serif;
    padding: 24px; text-align: center;
  }
  .logo {
    width: 76px; height: 76px;
    display: grid; place-items: center;
    background: rgba(255,122,0,.12);
    border: 1px solid rgba(255,122,0,.35);
    border-radius: 22px;
    box-shadow: 0 0 24px rgba(255,122,0,.25);
    margin-bottom: 16px;
  }
  h1 {
    margin: 0 0 8px;
    font-size: 25px; font-weight: 900;
    background: linear-gradient(120deg, #ffd9a8 0%, #ff9d3d 40%, #ff7a00 75%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .place { margin: 16px 0 4px; font-size: 19px; font-weight: 800; }
  .coords {
    direction: ltr; unicode-bidi: isolate;
    font-variant-numeric: tabular-nums;
    font-size: 12px; color: var(--muted);
    margin-bottom: 30px;
  }
  .btn {
    width: min(340px, 100%);
    height: 56px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    font-size: 16px; font-weight: 800;
    border-radius: 16px;
    cursor: pointer; text-decoration: none;
    transition: transform .15s ease;
    margin-bottom: 12px;
  }
  .btn:active { transform: scale(.96); }
  .btn svg { flex-shrink: 0; }
  .btn-app {
    background: linear-gradient(135deg, #ff7a00, #e06800);
    color: #0d0d0d;
    box-shadow: 0 6px 22px rgba(255,122,0,.45);
  }
  .btn-gmaps {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .get-app { margin-top: 12px; font-size: 13px; color: var(--muted); }
  .get-app a { color: var(--gold); font-weight: 700; text-decoration: none; }
  .footer { margin-top: 32px; font-size: 11px; color: #565049; }
</style>
</head>
<body>

<!-- ═══════════════════════════════════════════
     ✏️ الإعداد الوحيد — اتركه فارغاً الآن:
     وضع الملف الواحد: الزر البرتقالي يرسل للبحث
     عن التطبيق في Google Play بالاسم.
     عندما تنشر التطبيق كاملاً يوماً ما، ضع رابطه
     هنا — وسيعمل "افتح في التطبيق" تلقائياً.
     ═══════════════════════════════════════════ -->
<script>
  var APP_URL = "";
</script>

<span class="logo">
  <svg viewBox="0 0 24 24" width="40" height="40" fill="#ff7a00">
    <path d="M12 2C8.13 2 5 5.13 5 8c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
  </svg>
</span>

<h1>وين بالعراق</h1>

<div class="place" id="placeName">موقع مشارك</div>
<div class="coords" id="coords"></div>

<a class="btn btn-app" id="btnApp">
  <svg viewBox="0 0 24 24" width="22" height="22" fill="#0d0d0d">
    <path d="M12 2C8.13 2 5 5.13 5 8c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
  </svg>
  افتح في وين بالعراق
</a>

<a class="btn btn-gmaps" id="btnGmaps" target="_blank" rel="noopener">
  <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#9a938a" stroke-width="1.8">
    <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 1 1 16 0z"/>
    <circle cx="12" cy="10" r="3"/>
  </svg>
  افتح في خرائط جوجل
</a>

<div class="get-app">
  لا تملك التطبيق؟
  <a id="playLink" target="_blank" rel="noopener">حمّله من Google Play</a>
</div>

<div class="footer">وين بالعراق — دليلك الذكي لاستكشاف العراق</div>

<script>
  /* بحث متجر Play بالاسم — يصل هنا من الزر البرتقالي أيضاً
     في وضع الملف الواحد (التطبيق غير منشور بعد) */
  var PLAY_SEARCH = "https://play.google.com/store/search?q=" +
    encodeURIComponent("وين بالعراق") + "&c=apps";
  document.getElementById("playLink").href = PLAY_SEARCH;

  var q = new URLSearchParams(location.search);
  var lat = parseFloat(q.get("lat"));
  var lng = parseFloat(q.get("lng"));
  var name = q.get("n") || "";
  var valid = isFinite(lat) && isFinite(lng);

  var gmaps = document.getElementById("btnGmaps");

  if (valid) {
    if (name) document.getElementById("placeName").textContent = name;
    document.getElementById("coords").textContent =
      lat.toFixed(5) + ", " + lng.toFixed(5);

    /* ⚪ زر جوجل — يعمل مباشرة بلا أي استضافة للتطبيق */
    gmaps.href = "https://www.google.com/maps?q=" + lat + "," + lng +
      (name ? "(" + encodeURIComponent(name) + ")" : "");
  } else {
    gmaps.style.display = "none";
  }

  /* 🟠 الزر البرتقالي — ذكي حسب الوضع */
  document.getElementById("btnApp").addEventListener("click", function (e) {
    e.preventDefault();
    if (APP_URL && valid) {
      /* التطبيق منشور → افتحه على الموقع مباشرة (Deep Link) */
      window.location.href = APP_URL + "/index.html?lat=" + lat +
        "&lng=" + lng + (name ? "&n=" + encodeURIComponent(name) : "");
    } else {
      /* وضع الملف الواحد → متجر Play بالبحث بالاسم */
      window.location.href = PLAY_SEARCH;
    }
  });
</script>
</body>
</html>
